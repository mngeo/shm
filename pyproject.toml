[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shgeomag"
version = "0.1.0"
description = "Spherical-harmonic geomagnetic field modeling (IGRF/WMM/custom)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pyproj>=3.6",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "scipy>=1.11",
  "mypy>=1.8",
  "ruff>=0.5",
  "sphinx>=7.0",
  "pydata-sphinx-theme>=0.16",
]

[tool.setuptools.packages.find]
include = ["shgeomag*"]

[tool.setuptools.package-data]
"shgeomag" = ["py.typed"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true
